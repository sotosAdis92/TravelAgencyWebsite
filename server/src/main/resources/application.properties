#Database Configuration
spring.application.name=server
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/tourismAppDB
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

#Session Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=30m

#Continent Image Configuration
app.image.continent.base-url=${}
app.image.continent.upload-dir=${}

app.image.country.upload-dir=${}
app.image.country.base-url=${}

app.image.trip.tripimage.upload-dir=${}
app.image.trip.tripimage.base-url=${}

app.image.trip.tripmap.upload-dir=${}
app.image.trip.tripmap.base-url=${}

app.image.trippictures.upload-dir=${}
app.image.trippictures.base-url=${}